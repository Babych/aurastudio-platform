name: Deploy AuraStudio AI Platform

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Edge
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers / Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Setup Python for Modal
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Modal
        run: pip install modal
        
      - name: Deploy to Modal Cloud GPU (Primary: dmytrobbch)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          python -m modal deploy modal/video_dance_service.py

      - name: Deploy to Modal Cloud GPU (Secondary: memory1024)
        if: ${{ secrets.MODAL_TOKEN_ID_SECONDARY != '' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID_SECONDARY }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET_SECONDARY }}
        run: |
          python -m modal deploy modal/video_dance_service.py
